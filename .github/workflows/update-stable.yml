name: Build and release Hermes Desktop stable

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/hermes-lifecycle.ps1'
      - 'scripts/hermes-install-compat.ps1'
      - 'scripts/hermes-desktop.ps1'
      - 'packaging-revision.txt'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/update-stable.yml'

permissions:
  contents: write

concurrency:
  group: hermes-stable-manifest
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node for Desktop build
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'

      - name: Build or reuse immutable Desktop release
        id: manifest
        shell: pwsh
        run: ./tools/prepare-desktop-release.ps1

      - name: Validate repository contracts under Windows PowerShell 5.1
        shell: powershell
        run: .\tests\test-repository.ps1

      - name: Validate repository contracts under PowerShell 7
        shell: pwsh
        run: ./tests/test-repository.ps1

      - name: Detect manifest changes
        id: changes
        shell: pwsh
        run: |
          $status = git status --porcelain -- bucket/hermes-agent-stable.json
          if ([string]::IsNullOrWhiteSpace(($status -join ''))) {
            'changed=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            'changed=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Install Scoop for package test
        if: steps.changes.outputs.changed == 'true' || github.event_name != 'schedule'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          scoop --version
          $scoopRepo = Join-Path $env:USERPROFILE 'scoop\apps\scoop\current'
          if (Test-Path (Join-Path $scoopRepo '.git')) {
            git -C $scoopRepo rev-parse HEAD
          }

      - name: Clean-install generated package on isolated Hermes home
        if: steps.changes.outputs.changed == 'true' || github.event_name != 'schedule'
        shell: pwsh
        run: |
          $env:HERMES_HOME = Join-Path $env:RUNNER_TEMP 'hermes-stable-clean-install'
          # Test the exact archive before publishing it. Only its transport URL changes.
          $manifest = Get-Content '.\bucket\hermes-agent-stable.json' -Raw | ConvertFrom-Json
          $manifest.architecture.'64bit'.url[1] = 'http://127.0.0.1:18765/hermes-desktop-windows-x64.zip'
          $manifestPath = Join-Path $env:RUNNER_TEMP 'hermes-agent-stable.json'
          $manifest | ConvertTo-Json -Depth 12 | Set-Content $manifestPath -Encoding utf8
          $server = Start-Process python -ArgumentList @('-m', 'http.server', '18765', '--bind', '127.0.0.1', '--directory', ('"' + '${{ steps.manifest.outputs.directory }}' + '"')) -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try { $null = Invoke-WebRequest 'http://127.0.0.1:18765/SHA256SUMS.txt'; $ready = $true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Local artifact server did not start.' }
            scoop install $manifestPath
            if ($LASTEXITCODE -ne 0) { throw "Scoop install failed with exit code $LASTEXITCODE." }
          } finally { Stop-Process -Id $server.Id -ErrorAction SilentlyContinue }
          if ($LASTEXITCODE -ne 0) {
            throw "Scoop install failed with exit code $LASTEXITCODE."
          }
          $candidates = @(
            (Join-Path $env:HERMES_HOME 'bin\hermes.exe'),
            (Join-Path $env:HERMES_HOME 'bin\hermes.cmd'),
            (Join-Path $env:HERMES_HOME 'hermes-agent\venv\Scripts\hermes.exe')
          )
          $hermes = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $hermes) { throw 'Hermes CLI not found after clean Scoop install.' }
          & $hermes --version
          if ($LASTEXITCODE -ne 0) { throw 'Hermes CLI version check failed.' }
          $head = git -C (Join-Path $env:HERMES_HOME 'hermes-agent') rev-parse HEAD
          if ($head.Trim().ToLowerInvariant() -ne '${{ steps.manifest.outputs.commit }}') { throw "Clean install commit mismatch: $head" }

      - name: Launch installed Desktop and verify its renderer
        if: steps.changes.outputs.changed == 'true' || github.event_name != 'schedule'
        shell: pwsh
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'hermes-smoke-deps'
          New-Item -ItemType Directory -Force $deps | Out-Null
          npm install --prefix $deps playwright-core@1.62.1 --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Smoke test dependency install failed.' }
          $env:HERMES_HOME = Join-Path $env:RUNNER_TEMP 'hermes-stable-clean-install'
          node ./tests/smoke-desktop.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Desktop smoke test failed.' }

      - name: Integration-test real upgrade and rollback lifecycle
        if: steps.changes.outputs.changed == 'true' || github.event_name != 'schedule'
        shell: pwsh
        run: |
          $desktop = Join-Path $env:RUNNER_TEMP 'hermes-stable-clean-install\hermes-agent\apps\desktop\release\win-unpacked'
          ./tests/integration-lifecycle.ps1 -TargetTag '${{ steps.manifest.outputs.tag }}' -TargetCommit '${{ steps.manifest.outputs.commit }}' -DesktopSourcePath $desktop

      - name: Publish verified Desktop release
        if: steps.manifest.outputs.published == 'false'
        shell: pwsh
        run: |
          $dir = '${{ steps.manifest.outputs.directory }}'
          gh release create '${{ steps.manifest.outputs.releaseTag }}' (Join-Path $dir 'hermes-desktop-windows-x64.zip') (Join-Path $dir 'SHA256SUMS.txt') (Join-Path $dir 'release-plan.json') (Join-Path $dir 'desktop-smoke.png') (Join-Path $dir 'desktop-smoke.txt') --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Hermes Desktop stable ${{ steps.manifest.outputs.version }}' --notes-file (Join-Path $dir 'release-notes.md')
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed; manifest will not be committed.' }

      - name: Commit published manifest
        if: steps.changes.outputs.changed == 'true'
        shell: pwsh
        run: |
          git fetch origin master
          if ($LASTEXITCODE -ne 0) { throw 'Could not check the current branch before publication.' }
          $remoteHead = git rev-parse origin/master
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the current branch.' }
          if ($remoteHead.Trim() -ne $env:GITHUB_SHA) {
            Write-Host 'A newer commit superseded this run. Leave its manifest to the next workflow; the verified release is already available.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bucket/hermes-agent-stable.json
          git commit -m "hermes-agent-stable: ${{ steps.manifest.outputs.version }}"
          git push
