name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'bucket/hermes-agent-stable.json'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate repository under Windows PowerShell 5.1
        shell: powershell
        run: .\tests\test-repository.ps1

      - name: Validate repository under PowerShell 7
        shell: pwsh
        run: ./tests/test-repository.ps1
