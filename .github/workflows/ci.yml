name: CI

on:
  pull_request:
  push:
    branches: [master]
    paths-ignore:
      - 'bucket/hermes-agent-stable.json'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate repository under Windows PowerShell 5.1
        shell: powershell
        run: .\tests\test-repository.ps1

      - name: Validate repository under PowerShell 7
        shell: pwsh
        run: ./tests/test-repository.ps1

      - name: Reject incomplete Desktop readiness
        shell: pwsh
        run: node ./tests/test-desktop-readiness.cjs
